name: checks

# The gates exist as scripts; this makes them gates. Before this file, every
# check in run-checks.sh ran only when a human remembered to type it.
#
# Three jobs, because they have three different costs and three different
# failure semantics:
#   checks    — deterministic, ~2 min, must block every push
#   perf      — timing-sensitive, must NOT block on a noisy runner, runs on main
#   mutation  — ~25 min, weekly + manual; its job is the *trend*, not the push

# Least privilege, declared once: every job below reads the repo and nothing
# else. Without this block the default token carries write permissions that no
# step in this file needs.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: install
        # `[dev]` pulls numpy + pytest + coverage + fastembed: exactly what
        # run-checks.sh needs. Before this step existed the job failed on
        # `pytest: not found`; before `[dev]` carried fastembed it failed on the
        # routing bars, which are measured with the semantic layer on.
        run: pip install -e ".[dev]"
      - name: the catalogue under test
        # ECC is read from $ECC_ROOT (~/ECC by default) and is never vendored.
        # Fetched *by commit* (ecc-pin.txt): a `git clone` at HEAD means the
        # fixture moves under CI, and on 2026-10-30 it moved 607 -> 611 docs
        # between two runs twenty minutes apart, flipping a property test.
        run: |
          ./tools/fetch_ecc.sh "$HOME/ECC"
          ./eccx index
      - name: semantic layer (optional dependency)
        run: ./eccx vectors --force   # ~9 min: 607 docs + 4 906 sections
      - name: unit tests, coverage, gaps, conformity, eval
        run: ./run-checks.sh
      - name: the corpus path is what the product is for
        run: python3 tools/corpus_smoke.py
      - name: coverage hole report (informational)
        if: always()
        run: python3 tools/coverage_holes.py || true

  perf:
    # Separate job on purpose: a shared runner is noisier than the 2-vCPU
    # sandbox these budgets were declared on. A perf failure here is a signal
    # to look, not an automatic block — hence `continue-on-error`.
    needs: checks
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: python3 perf/budgets.py

  mutation:
    # Three tiers, because one job cannot be both fast and thorough.
    #
    # The full run answers "does the suite notice when the product is wrong?"
    # and takes ~90 minutes: it belongs to a schedule, and to nothing else.
    # Each run of it now writes down its own duration, so the number in this
    # comment can be checked instead of believed.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          persist-credentials: false        # `--changed` needs a base to diff against
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install mutmut
      - name: mutation score (full scope, gating)
        run: ./tools/mutate.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: mutation-report
          path: docs/MUTATION.md

  mutation-diff:
    # The per-change tier: only the modules the pull request touched, on a
    # throwaway worktree, with its own cache. Measured at 63-99 s for a
    # 453-mutant scope against ~90 min for 2 639 — the difference between a
    # check people read and a check people mute.
    #
    # Advisory on purpose. A partial score is not comparable with the global
    # floor (nothing has calibrated "what share of *these* mutants should
    # die"), so failing on it would produce exactly one outcome: people
    # ignoring the check. The feedback is the survivor list.
    needs: checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install mutmut
      - name: mutation score (diff scope, advisory)
        # `${{ github.base_ref }}` comes from the *pull request*, i.e. from
        # whoever opened it, and interpolating it into a `run:` block hands
        # them this job's shell (zizmor: template-injection, high). Pass it
        # through the environment instead, where it is data.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: ./tools/mutate.sh --changed "origin/${BASE_REF}"

  hygiene:
    # Validators written by other people, because a project that grades its
    # own exam is not graded. Each step answers a question this repository
    # cannot answer about itself:
    #   ruff     — undefined names, dead code, silent dict-key collisions
    #              (found `die()` called in three places and imported in none)
    #   zizmor   — supply chain and injection in *this* workflow file
    #              (found github.base_ref interpolated into a shell command)
    #   pip-audit — CVEs in what a user actually installs, external database
    #   packaging — does the wheel install and route on a machine that has
    #              never seen this checkout
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install -e ".[dev]" ruff zizmor pip-audit build pip-licenses
      - name: "ruff (F: real bugs, E9: syntax, B: likely mistakes)"
        run: ruff check eccxlib tools --select F,E9,B
      - name: zizmor (audit of this workflow)
        run: zizmor --format plain .github/workflows/checks.yml
      - name: dependency audit (external CVE database)
        # `eccx` is installed editable, so pip-audit cannot look it up on PyPI;
        # everything it *does* depend on is audited.
        run: pip-audit --progress-spinner off
      - name: packaging — build the wheel and use it
        run: |
          set -eu
          python -m build --wheel
          python -m venv /tmp/inst
          /tmp/inst/bin/pip install --quiet dist/*.whl
          /tmp/inst/bin/eccx --version

          mkdir -p /tmp/demo
          printf '# Procedures\n\n## Sauvegardes\n\nLa rotation des sauvegardes est quotidienne.\n' > /tmp/demo/sauvegardes.md
          printf '# Menus\n\n## Carte du midi\n\nLe plat du jour change chaque semaine.\n' > /tmp/demo/menus.md

          export HOME=/tmp/inst-home
          /tmp/inst/bin/eccx --corpus /tmp/demo corpus build
          /tmp/inst/bin/eccx --corpus /tmp/demo recall \
              "la rotation des sauvegardes est quotidienne" --k 1 --json > /tmp/out.json
          python - <<'EOF'
          import json, sys
          d = json.load(open("/tmp/out.json"))
          ids = [c["id"] for c in d["candidates"]]
          if not ids or ids[0] != "sauvegardes":
              sys.exit(f"the installed wheel routed to {ids}, "
                       f"not to the file that answers")
          print("wheel routes correctly:", ids[:3])
          EOF
