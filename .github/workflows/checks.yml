name: checks

# The gates exist as scripts; this makes them gates. Before this file, every
# check in run-checks.sh ran only when a human remembered to type it.
#
# Three jobs, because they have three different costs and three different
# failure semantics:
#   checks    — deterministic, ~2 min, must block every push
#   perf      — timing-sensitive, must NOT block on a noisy runner, runs on main
#   mutation  — ~25 min, weekly + manual; its job is the *trend*, not the push

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: semantic layer (optional dependency)
        run: |
          pip install --quiet fastembed
          ./eccx vectors            # ~40 s, cached in .eccx/vectors.npy
      - name: unit tests, coverage, gaps, conformity, eval
        run: ./run-checks.sh
      - name: coverage hole report (informational)
        if: always()
        run: python3 tools/coverage_holes.py || true

  perf:
    # Separate job on purpose: a shared runner is noisier than the 2-vCPU
    # sandbox these budgets were declared on. A perf failure here is a signal
    # to look, not an automatic block — hence `continue-on-error`.
    needs: checks
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 perf/budgets.py

  mutation:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mutmut
      - name: mutation score
        run: ./tools/mutate.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: docs/MUTATION.md
